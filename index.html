<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>micro:bit USB Alert Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}

h1 {
    margin-bottom: 10px;
}

button {
    font-size: 18px;
    padding: 12px 20px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

#connectBtn {
    background: #1e88e5;
    color: white;
}

#alertBtn {
    background: #d32f2f;
    color: white;
}

#normalBtn {
    background: #388e3c;
    color: white;
}

#status {
    margin-top: 15px;
    font-size: 16px;
    color: #90caf9;
}
</style>
</head>

<body>

<h1>micro:bit USB Alert Control</h1>
<p>PC only • USB Cable • Web Serial</p>

<button id="connectBtn">Connect micro:bit</button><br>

<button id="alertBtn" disabled>Send ALERT (A)</button>
<button id="normalBtn" disabled>Send NORMAL (B)</button>

<div id="status">Status: Not connected</div>

<script>
let port;
let writer;

const connectBtn = document.getElementById("connectBtn");
const alertBtn   = document.getElementById("alertBtn");
const normalBtn  = document.getElementById("normalBtn");
const statusDiv  = document.getElementById("status");

async function connectSerial() {
    try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        writer = port.writable.getWriter();

        statusDiv.innerText = "Status: micro:bit connected";
        alertBtn.disabled = false;
        normalBtn.disabled = false;

    } catch (err) {
        alert("Connection failed: " + err);
    }
}

async function sendCommand(cmd) {
    if (!writer) return;

    const data = new TextEncoder().encode(cmd + "\n");
    await writer.write(data);
}

connectBtn.onclick = connectSerial;

alertBtn.onclick = () => {
    sendCommand("A");
    statusDiv.innerText = "Status: ALERT sent (A)";
};

normalBtn.onclick = () => {
    sendCommand("B");
    statusDiv.innerText = "Status: NORMAL sent (B)";
};
</script>

</body>
</html>
