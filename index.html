<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Micro:bit Alert Control (USB Serial)</title>

<style>
  body {
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
  }
  h1 { margin-bottom: 10px; }
  button {
    padding: 14px 24px;
    margin: 10px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    font-weight: bold;
  }
  .connect { background: #3498db; color: white; }
  .alert { background: #e74c3c; color: white; }
  .normal { background: #2ecc71; color: white; }
  #status {
    margin-top: 15px;
    font-size: 16px;
    color: #6cf;
  }
</style>
</head>

<body>

<h1>micro:bit Alert Control</h1>
<p>USB OTG → Web Serial → micro:bit</p>

<button class="connect" onclick="connectSerial()">Connect micro:bit</button>
<br>
<button class="alert" onclick="sendAlert()">TEST ALERT (A)</button>
<button class="normal" onclick="sendNormal()">TEST NORMAL (B)</button>

<p id="status">Status: Not connected</p>

<script>
let port;
let writer;

// ---------- CONNECT ----------
async function connectSerial() {
  if (!("serial" in navigator)) {
    alert("Web Serial not supported. Use Chrome.");
    return;
  }

  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });

    writer = port.writable.getWriter();
    document.getElementById("status").innerText =
      "Status: Connected to micro:bit (USB)";
  } catch (err) {
    alert("Connection failed: " + err);
  }
}

// ---------- SEND DATA ----------
async function sendLine(text) {
  if (!writer) {
    alert("Please connect micro:bit first");
    return;
  }

  const data = new TextEncoder().encode(text + "\n");
  await writer.write(data);
}

// ---------- BUTTON ACTIONS ----------
function sendAlert() {
  sendLine("A");
  alert("Sent ALERT (A)");
}

function sendNormal() {
  sendLine("B");
  alert("Sent NORMAL (B)");
}
</script>

</body>
</html>
