<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TFJS Crowd Counter + micro:bit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- TensorFlow.js + COCO-SSD -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    h1 { margin: 8px 0 4px; font-size: 1.4rem; text-align: center; }
    h2 { font-size: 1rem; opacity: 0.8; text-align: center; }

    #videoContainer {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin-top: 12px;
      border-radius: 8px;
      overflow: hidden;
      background: #111;
    }

    video, canvas { width: 100%; display: block; }

    #overlayCanvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .center-text {
      margin-top: 12px;
      font-size: 1.6rem;
    }

    .count-value {
      color: #4caf50;
      font-weight: bold;
    }

    .controlsRow {
      width: 100%;
      max-width: 600px;
      display: flex;
      gap: 10px;
      margin-top: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 14px;
      font-size: 1rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      min-width: 120px;
      font-weight: 600;
    }

    #btnConnectMicrobit { background: #f9a825; color: #000; }
    #btnRestart { background: #1565c0; color: #fff; }
    #btnMute { background: #555; color: #fff; }

    #alertBox {
      display: none;
      margin-top: 16px;
      padding: 14px;
      background: #c62828;
      border-radius: 10px;
      font-size: 1.4rem;
      font-weight: bold;
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    #statusText, #microbitStatus {
      margin-top: 8px;
      font-size: 1rem;
      text-align: center;
    }

    #microbitStatus { color: #64b5f6; }
  </style>
</head>

<body>
  <h1>AI Crowd Counter + micro:bit</h1>
  <h2>Camera → AI → Bluetooth → Alert</h2>

  <div id="videoContainer">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlayCanvas"></canvas>
  </div>

  <div class="center-text">
    People Count: <span id="peopleCount" class="count-value">0</span>
  </div>

  <div class="controlsRow">
    <button id="btnConnectMicrobit">Connect micro:bit</button>
    <button id="btnRestart">Restart</button>
    <button id="btnMute">Mute Sound</button>
  </div>

  <div id="alertBox">⚠ CROWD ALERT ⚠</div>

  <div id="statusText">Initializing…</div>
  <div id="microbitStatus">micro:bit: Not connected</div>

<script>
  let model;
  let lastAlertState = "SAFE";
  let soundMuted = false;

  let microbitDevice = null;
  let uartTxCharacteristic = null;

  const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
  const UART_TX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

  const video = document.getElementById("video");
  const canvas = document.getElementById("overlayCanvas");
  const ctx = canvas.getContext("2d");

  const peopleCountEl = document.getElementById("peopleCount");
  const alertBox = document.getElementById("alertBox");
  const statusText = document.getElementById("statusText");
  const microbitStatus = document.getElementById("microbitStatus");

  function playBeep() {
    if (soundMuted) return;
    const ac = new AudioContext();
    const osc = ac.createOscillator();
    osc.frequency.value = 800;
    osc.connect(ac.destination);
    osc.start();
    osc.stop(ac.currentTime + 0.2);
  }

  async function loadModel() {
    model = await cocoSsd.load({ base: "lite_mobilenet_v2" });
    statusText.textContent = "Model loaded";
  }

  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    return new Promise(r => video.onloadedmetadata = r);
  }

  async function detectLoop() {
    const preds = await model.detect(video);
    let count = 0;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    preds.forEach(p => {
      if (p.class === "person" && p.score > 0.5) {
        count++;
        const [x,y,w,h] = p.bbox;
        ctx.strokeStyle = "red";
        ctx.strokeRect(x,y,w,h);
      }
    });

    peopleCountEl.textContent = count;
    updateAlert(count, 3);
  }

  function updateAlert(count, threshold) {
    const alert = count >= threshold;

    if (alert) {
      alertBox.style.display = "block";
      if (lastAlertState !== "ALERT") {
        playBeep();
        sendToMicrobit("A\n");   // ✅ ALERT
      }
      lastAlertState = "ALERT";
    } else {
      alertBox.style.display = "none";
      if (lastAlertState !== "SAFE") {
        sendToMicrobit("B\n");   // ✅ NORMAL
      }
      lastAlertState = "SAFE";
    }
  }

  async function connectMicrobit() {
    microbitDevice = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "BBC micro:bit" }],
      optionalServices: [UART_SERVICE_UUID]
    });

    const server = await microbitDevice.gatt.connect();
    const service = await server.getPrimaryService(UART_SERVICE_UUID);
    uartTxCharacteristic = await service.getCharacteristic(UART_TX_UUID);

    microbitStatus.textContent = "micro:bit: Connected";
  }

  async function sendToMicrobit(msg) {
    if (!uartTxCharacteristic) return;
    const enc = new TextEncoder();
    await uartTxCharacteristic.writeValue(enc.encode(msg));
  }

  document.getElementById("btnConnectMicrobit").onclick = connectMicrobit;
  document.getElementById("btnRestart").onclick = () => location.reload();
  document.getElementById("btnMute").onclick = () => {
    soundMuted = !soundMuted;
  };

  async function start() {
    await loadModel();
    await startCamera();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    setInterval(detectLoop, 600);
  }

  start();
</script>
</body>
</html>
