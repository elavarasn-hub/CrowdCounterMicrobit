<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Crowd Alert System (Master / Client)</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #eee;
  text-align: center;
  padding: 10px;
}
h1 { font-size: 26px; }
#video {
  width: 95%;
  max-width: 420px;
  border-radius: 12px;
  border: 2px solid #444;
  background: black;
}
#alertBox {
  display: none;
  margin-top: 12px;
  padding: 14px;
  background: red;
  font-size: 22px;
  font-weight: bold;
  border-radius: 10px;
  animation: blink 0.6s infinite;
}
@keyframes blink { 50% { opacity: 0.3; } }
.green { color: #0f0; }
.blue { color: #6cf; }
</style>
</head>

<body>

<h1>AI Crowd Alert System</h1>
<p id="modeInfo"></p>

<video id="video" autoplay playsinline></video>

<h2>People Count: <span id="cnt" class="green">0</span></h2>

<div id="alertBox">⚠ CROWD ALERT ⚠</div>

<p id="status">Initializing…</p>
<p id="mb" class="blue">micro:bit: Not connected</p>

<script>
/* ===============================
   MODE CONTROL
================================ */
const params = new URLSearchParams(window.location.search);
const MODE = params.get("mode") === "master" ? "master" : "client";

document.getElementById("modeInfo").innerText =
  MODE === "master" ? "🟢 MASTER MODE (AI + Camera)" : "🔵 CLIENT MODE (Alert Only)";

/* ===============================
   GLOBAL VARIABLES
================================ */
let model;
let video = document.getElementById("video");
let cntSpan = document.getElementById("cnt");
let statusText = document.getElementById("status");
let mbText = document.getElementById("mb");
let threshold = 3;

let alertSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
alertSound.loop = true;

/* ===============================
   MICRO:BIT UUIDs
================================ */
const NUS_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const NUS_TX_CHAR_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

let microbitDevice = null;
let microbitTxChar = null;

/* ===============================
   WEBSOCKET (GLOBAL)
================================ */
window.ws = new WebSocket("wss://ws-relay-zqzk.onrender.com");
let lastAlertState = false;

ws.onopen = () => console.log("✅ WebSocket connected");

ws.onerror = (e) => console.error("WebSocket error", e);

/* ===============================
   SEND ALERT (MASTER ONLY)
================================ */
function sendCrowdAlert(count) {
  if (MODE !== "master") return;
  if (ws.readyState !== WebSocket.OPEN) return;

  const alertState = count >= threshold;
  if (alertState === lastAlertState) return;
  lastAlertState = alertState;

  ws.send(JSON.stringify({ count, alert: alertState }));
}

/* ===============================
   RECEIVE ALERT (ALL CLIENTS)
================================ */
ws.onmessage = (event) => {
  const data = JSON.parse(event.data);
  if (data.alert) {
    document.getElementById("alertBox").style.display = "block";
    document.body.style.backgroundColor = "darkred";
    alertSound.play();
  } else {
    document.getElementById("alertBox").style.display = "none";
    document.body.style.backgroundColor = "#111";
    alertSound.pause();
  }
};

/* ===============================
   MICRO:BIT HELPERS
================================ */
function setMicrobitStatus(msg) {
  mbText.innerText = "micro:bit: " + msg;
}

async function sendToMicrobit(msg) {
  if (!microbitTxChar) return;
  let data = new TextEncoder().encode(msg + "\n");
  await microbitTxChar.writeValue(data);
}

/* ===============================
   CAMERA + MODEL
================================ */
async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" },
    audio: false
  });
  video.srcObject = stream;
  return new Promise(r => video.onloadedmetadata = r);
}

async function init() {
  if (MODE === "master") {
    statusText.innerText = "Loading AI model…";
    model = await cocoSsd.load();
    await setupCamera();
    statusText.innerText = "Running detection…";
    detectFrame();
    autoConnectMicrobit();
  } else {
    statusText.innerText = "Waiting for alerts…";
    video.style.display = "none";
  }
}
init();

/* ===============================
   DETECTION LOOP (MASTER)
================================ */
async function detectFrame() {
  const predictions = await model.detect(video);
  const people = predictions.filter(p => p.class === "person");
  const count = people.length;

  cntSpan.innerText = count;

  sendCrowdAlert(count);

  if (count >= threshold) {
    sendToMicrobit("ALERT " + count);
  }

  requestAnimationFrame(detectFrame);
}

/* ===============================
   MICRO:BIT AUTO CONNECT
================================ */
async function autoConnectMicrobit() {
  try {
    const devs = await navigator.bluetooth.getDevices();
    if (devs.length > 0) {
      microbitDevice = devs[0];
      const server = await microbitDevice.gatt.connect();
      const service = await server.getPrimaryService(NUS_SERVICE_UUID);
      microbitTxChar = await service.getCharacteristic(NUS_TX_CHAR_UUID);
      setMicrobitStatus("Connected");
    }
  } catch (e) {}
}
</script>

</body>
</html>
