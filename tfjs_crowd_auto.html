<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TFJS Crowd Counter + micro:bit (Auto-Connect)</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #eee;
  text-align: center;
  padding: 10px;
}
h1 { font-size: 28px; margin-bottom: 6px; }
#video {
  width: 95%;
  max-width: 430px;
  border-radius: 15px;
  border: 2px solid #444;
  background: #000;
}
button {
  padding: 10px 18px;
  border: none;
  margin: 5px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
}
.green { background: #2ecc71; color: #fff; }
.blue { background: #3498db; color: #fff; }
.orange { background: #f39c12; color: #fff; }
.gray { background: #7f8c8d; color: #fff; }

#alertBox {
  margin-top: 12px;
  padding: 15px;
  display: none;
  background: #ff0000;
  color: white;
  font-size: 22px;
  font-weight: bold;
  border-radius: 12px;
  animation: blinker 0.55s linear infinite;
}
@keyframes blinker {
  50% { opacity: 0.25; }
}
</style>
</head>
<body>

<h1>TFJS Crowd Counter + micro:bit<br>(Auto-Connect)</h1>
<p>Counts people with AI and sends danger signal to micro:bit.</p>

<video id="video" autoplay playsinline></video>

<h2>People Count: <span id="cnt" style="color:#0f0">0</span></h2>

<div>
  Threshold:
  <input id="threshold" type="number" value="3" style="width:65px;font-size:18px;text-align:center;">
  <button class="green" onclick="setThreshold()">Set Threshold</button>
</div>

<button class="gray" onclick="toggleSound()">Mute Sound</button>
<button class="blue" onclick="restartAll()">Restart (Camera + micro:bit)</button>
<button class="orange" onclick="connectMicrobit()">Connect micro:bit (manual)</button>

<div id="alertBox">⚠ ALERT — Danger Crowd Level! ⚠</div>

<p id="status" style="margin-top:12px;">Running detection…</p>
<p id="mb" style="margin-top:4px;color:#6cf;">micro:bit: Not connected</p>

<script>
let model;
let video = document.getElementById("video");
let cntSpan = document.getElementById("cnt");
let statusText = document.getElementById("status");
let mbText = document.getElementById("mb");
let threshold = 3;
let soundMuted = false;

let alertSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
alertSound.loop = true;

// micro:bit Bluetooth UUIDs (UART)
const NUS_SERVICE_UUID  = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const NUS_TX_CHAR_UUID  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

let microbitDevice = null;
let microbitServer = null;
let microbitTxChar = null;

function setMicrobitStatus(msg) {
  mbText.innerText = "micro:bit: " + msg;
}

// Start camera
async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" },
    audio: false
  });
  video.srcObject = stream;
  return new Promise(resolve => {
    video.onloadedmetadata = () => resolve(video);
  });
}

// Load TFJS Model
async function init() {
  statusText.innerText = "Loading AI model…";
  model = await cocoSsd.load();
  statusText.innerText = "Starting camera…";
  await setupCamera();
  statusText.innerText = "Running detection…";
  detectFrame();
  autoConnectMicrobit();
}
init();

// Detection Loop
async function detectFrame() {
  const predictions = await model.detect(video);

  let people = predictions.filter(p => p.class === "person");
  cntSpan.innerText = people.length;

  if (people.length >= threshold) {
    document.getElementById("alertBox").style.display = "block";
    if (!soundMuted) alertSound.play();

    sendToMicrobit("ALERT");
  } else {
    document.getElementById("alertBox").style.display = "none";
    alertSound.pause();
  }

  requestAnimationFrame(detectFrame);
}

// Threshold
function setThreshold() {
  threshold = parseInt(document.getElementById("threshold").value);
  alert("Threshold set to " + threshold);
}

// Sound toggle
function toggleSound() {
  soundMuted = !soundMuted;
  alertSound.pause();
}

// Restart
function restartAll() {
  alertSound.pause();
  microbitDevice = null;
  mbText.innerText = "micro:bit: Not connected";
  autoConnectMicrobit();
}

// ================================
// micro:bit Bluetooth Functions
// ================================

// Auto-connect on load
async function autoConnectMicrobit() {
  try {
    const devs = await navigator.bluetooth.getDevices();
    if (devs.length > 0) {
      microbitDevice = devs[0];
      await connectToKnownMicrobit();
    }
  } catch (e) {}
}

// Manual connect
async function connectMicrobit() {
  if (!navigator.bluetooth) {
    alert("Bluetooth not supported.");
    return;
  }

  try {
    setMicrobitStatus("Scanning…");

    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [NUS_SERVICE_UUID]
    });

    microbitDevice = device;
    await connectToKnownMicrobit();
  } catch (err) {
    alert("Bluetooth Error: " + err);
  }
}

// Connect to device
async function connectToKnownMicrobit() {
  try {
    setMicrobitStatus("Connecting…");
    microbitServer = await microbitDevice.gatt.connect();

    const service = await microbitServer.getPrimaryService(NUS_SERVICE_UUID);
    microbitTxChar = await service.getCharacteristic(NUS_TX_CHAR_UUID);

    setMicrobitStatus("Connected");
  } catch (err) {
    setMicrobitStatus("Failed");
    alert("Microbit connect error: " + err);
  }
}

// Send alert to micro:bit
async function sendToMicrobit(msg) {
  if (!microbitTxChar) return;

  let data = new TextEncoder().encode(msg + "\n");
  try {
    await microbitTxChar.writeValue(data);
  } catch (e) {
    console.log("Write fail:", e);
  }
  // ===============================
// WebSocket Alert Receiver (NEW)
// ===============================

window.ws = new WebSocket("wss://ws-relay-zqzk.onrender.com");


ws.onopen = () => {
  console.log("Alert WebSocket connected");
};

ws.onmessage = (event) => {
  try {
    const data = JSON.parse(event.data);

    if (data.alert) {
      alert("⚠ CROWD ALERT ⚠\nCount: " + data.count);

      // optional visual indicator
      document.body.style.backgroundColor = "red";

      // optional: send alert to micro:bit
      sendToMicrobit("ALERT " + data.count);
    } else {
      document.body.style.backgroundColor = "";
    }

  } catch (e) {
    console.error("Invalid WebSocket message", e);
  }
};

ws.onerror = (err) => {
  console.error("WebSocket error", err);
};
</script>
</body>
</html>
