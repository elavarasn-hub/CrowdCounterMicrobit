<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TFJS Crowd Counter + micro:bit</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #eee;
  text-align: center;
  padding: 10px;
}

#video {
  width: 95%;
  max-width: 430px;
  border-radius: 15px;
  border: 2px solid #444;
}

button {
  padding: 10px 18px;
  margin: 5px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  border: none;
}

.green { background:#2ecc71; color:#fff; }
.blue { background:#3498db; color:#fff; }
.orange { background:#f39c12; color:#fff; }
.gray { background:#7f8c8d; color:#fff; }

#alertBox {
  display:none;
  margin-top:12px;
  padding:15px;
  background:red;
  color:white;
  font-size:22px;
  font-weight:bold;
  border-radius:12px;
  animation: blink 0.5s infinite;
}

@keyframes blink {
  50% { opacity:0.25; }
}

#ribbon {
  display:none;
  margin:8px auto;
  padding:6px 12px;
  background:#b30000;
  color:white;
  font-weight:bold;
  border-radius:6px;
  width:fit-content;
}
</style>
</head>

<body>

<h1>TFJS Crowd Counter + micro:bit</h1>
<p id="modeInfo"></p>
<div id="ribbon">🚨 ALERT SENT TO CLIENTS</div>

<video id="video" autoplay playsinline></video>

<h2>People Count: <span id="cnt" style="color:#0f0">0</span></h2>

<!-- MASTER CONTROLS -->
<div id="masterControls">
  Threshold:
  <input id="threshold" type="number" value="3" style="width:60px">
  <button class="green" onclick="setThreshold()">Set</button><br>

  <button class="gray" onclick="toggleSound()">Mute Sound</button>
  <button class="blue" onclick="restartAll()">Restart</button>
  <button class="orange" onclick="connectMicrobit()">Connect micro:bit</button>
</div>

<!-- CLIENT CONTROLS -->
<div id="clientControls">
  <button class="gray" onclick="toggleSound()">Mute Sound</button>
  <button class="blue" onclick="togglePopup()" id="popupBtn">Popup: OFF</button>
</div>

<div id="alertBox">⚠ CROWD ALERT ⚠</div>

<p id="status">Initializing…</p>
<p id="mb" style="color:#6cf;">micro:bit: Not connected</p>

<script>
/* ===============================
   ROLE (URL BASED)
================================ */
const params = new URLSearchParams(window.location.search);
const MODE = params.get("mode") === "master" ? "master" : "client";

document.getElementById("modeInfo").innerText =
  MODE === "master"
    ? "🟢 MASTER MODE (AI + micro:bit)"
    : "🔵 CLIENT MODE (Alert Viewer)";

/* ===============================
   UI VISIBILITY
================================ */
document.getElementById("masterControls").style.display =
  MODE === "master" ? "block" : "none";
document.getElementById("clientControls").style.display =
  MODE === "client" ? "block" : "none";
if (MODE === "client") document.getElementById("video").style.display = "none";

/* ===============================
   GLOBALS
================================ */
let model;
let video = document.getElementById("video");
let cntSpan = document.getElementById("cnt");
let statusText = document.getElementById("status");
let mbText = document.getElementById("mb");

let threshold = 3;
let soundMuted = false;
let popupEnabled = false;

/* 🔊 FAST CONTINUOUS BUZZER */
const alertSound = new Audio(
  "https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
);
alertSound.loop = true;
alertSound.playbackRate = 4.0;
alertSound.preload = "auto";

/* ===============================
   WEBSOCKET
================================ */
const ws = new WebSocket("wss://ws-relay-zqzk.onrender.com");

ws.onmessage = (e) => {
  if (MODE !== "client") return;

  const data = JSON.parse(e.data);

  if (data.alert) {
    document.getElementById("alertBox").style.display = "block";
    document.body.style.background = "red";

    if (!soundMuted && alertSound.paused) {
      alertSound.currentTime = 0;
      alertSound.play();
    }

    if (popupEnabled) {
      alert("⚠ CROWD ALERT ⚠\nDanger crowd level detected!");
    }

  } else {
    document.getElementById("alertBox").style.display = "none";
    document.body.style.background = "#111";
    alertSound.pause();
  }
};

/* ===============================
   MASTER ALERT SEND
================================ */
function sendCrowdAlert(count) {
  if (MODE !== "master") return;
  if (ws.readyState !== WebSocket.OPEN) return;

  ws.send(JSON.stringify({
    count: count,
    alert: count >= threshold
  }));
}

/* ===============================
   CAMERA + AI (MASTER)
================================ */
async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" },
    audio: false
  });
  video.srcObject = stream;
  return new Promise(r => video.onloadedmetadata = r);
}

async function init() {
  if (MODE === "master") {
    statusText.innerText = "Loading AI…";
    model = await cocoSsd.load();
    await setupCamera();
    statusText.innerText = "Running detection…";
    detectFrame();
    autoConnectMicrobit();
  } else {
    statusText.innerText = "Client mode — waiting for alerts";
  }
}
init();

/* ===============================
   DETECTION LOOP (MASTER)
================================ */
async function detectFrame() {
  const preds = await model.detect(video);
  const count = preds.filter(p => p.class === "person").length;

  cntSpan.innerText = count;
  sendCrowdAlert(count);

  if (count >= threshold) {
    document.getElementById("alertBox").style.display = "block";
    document.getElementById("ribbon").style.display = "block";

    if (!soundMuted && alertSound.paused) {
      alertSound.currentTime = 0;
      alertSound.play();
    }

    sendToMicrobit("ALERT " + count);
  } else {
    document.getElementById("alertBox").style.display = "none";
    document.getElementById("ribbon").style.display = "none";
    alertSound.pause();
  }

  requestAnimationFrame(detectFrame);
}

/* ===============================
   UI
================================ */
function setThreshold() {
  threshold = parseInt(document.getElementById("threshold").value);
  alert("Threshold set to " + threshold);
}

function toggleSound() {
  soundMuted = !soundMuted;
  alertSound.pause();
}

function togglePopup() {
  popupEnabled = !popupEnabled;
  document.getElementById("popupBtn").innerText =
    popupEnabled ? "Popup: ON" : "Popup: OFF";
}

function restartAll() {
  if (MODE !== "master") return;
  location.reload();
}

/* ===============================
   micro:bit
================================ */
const NUS_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const NUS_TX_CHAR_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

let microbitDevice = null;
let microbitTxChar = null;

async function sendToMicrobit(msg) {
  if (!microbitTxChar || MODE !== "master") return;
  const data = new TextEncoder().encode(msg + "\n");
  await microbitTxChar.writeValue(data);
}

async function autoConnectMicrobit() {
  try {
    const devs = await navigator.bluetooth.getDevices();
    if (devs.length > 0) {
      microbitDevice = devs[0];
      await connectToKnownMicrobit();
    }
  } catch {}
}

async function connectMicrobit() {
  if (MODE !== "master") return;
  microbitDevice = await navigator.bluetooth.requestDevice({
    acceptAllDevices: true,
    optionalServices: [NUS_SERVICE_UUID]
  });
  await connectToKnownMicrobit();
}

async function connectToKnownMicrobit() {
  const server = await microbitDevice.gatt.connect();
  const service = await server.getPrimaryService(NUS_SERVICE_UUID);
  microbitTxChar = await service.getCharacteristic(NUS_TX_CHAR_UUID);
  mbText.innerText = "micro:bit: Connected";
}
</script>

</body>
</html>
